<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; media-src * blob:; img-src * data: blob:; connect-src * https://*.firebaseio.com https://*.firebase.com wss://*.firebaseio.com;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
    <title>封号圈公会投票平台</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        /* ========== 全局变量 ========== */
        :root {
            --bg-deep: #0D0D11;
            --bg-card: rgba(22, 22, 30, 0.75);
            --bg-card-solid: #16161e;
            --neon-cyan: #00E0FF;
            --deep-purple: #7B2FF7;
            --gold: #FFB800;
            --text-primary: #e8e8f0;
            --text-secondary: #a0a0b8;
            --text-muted: #6a6a7a;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-glow: rgba(0, 224, 255, 0.5);
            --shadow-card: 0 4px 32px rgba(0, 0, 0, 0.55), 0 1px 4px rgba(0, 0, 0, 0.3);
            --shadow-elevated: 0 8px 48px rgba(0, 0, 0, 0.65), 0 2px 8px rgba(0, 224, 255, 0.08);
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition-fast: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.32s cubic-bezier(0.4, 0, 0.2, 1);
            --font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
        }

        /* ========== 基础重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-deep);
            font-family: var(--font-family);
            color: var(--text-primary);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            line-height: 1.5;
        }

        /* ========== 红包展示页 ========== */
        .red-packet-page {
            position: fixed;
            inset: 0;
            z-index: 4000;
            background: rgba(0,0,0,0.92);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 40px 20px;
            overflow-y: auto;
        }
        .red-packet-item {
    width: 120px;
    height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }
        .red-packet-item:active { transform: scale(1.2); }
        .red-packet-item .rp-icon {
            font-size: 3rem;
            filter: drop-shadow(0 0 10px rgba(255,0,0,0.6));
            animation: rpBounce 1s ease-in-out infinite;
        }
        .red-packet-item.grabbed .rp-icon {
            filter: grayscale(1);
            opacity: 0.4;
            animation: none;
        }
        .red-packet-item .rp-label {
            font-size: 0.7rem;
            color: #FFB800;
            margin-top: 4px;
            text-align: center;
        }
        .red-packet-item.grabbed .rp-label { color: #666; }
        @keyframes rpBounce {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .rp-close-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 4001;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* 低噪点背景纹理 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg width='280' height='280' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
            background-size: 280px 280px;
        }

        
        }

        /* 主容器 */
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px 16px 100px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ========== 顶部栏 ========== */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            padding: 14px 18px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-card);
            position: sticky;
            top: 12px;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .logo-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--neon-cyan);
            box-shadow: 0 0 14px var(--neon-cyan), 0 0 28px rgba(0, 224, 255, 0.4);
            animation: logoPulse 2s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% {
                box-shadow: 0 0 14px var(--neon-cyan), 0 0 28px rgba(0, 224, 255, 0.4);
            }
            50% {
                box-shadow: 0 0 22px var(--neon-cyan), 0 0 44px rgba(0, 224, 255, 0.7);
            }
        }

        .point-balance {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 40px;
            padding: 8px 16px;
            border: 1px solid rgba(255, 184, 0, 0.3);
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--gold);
            letter-spacing: 0.3px;
        }

        .point-icon {
            font-size: 1.2rem;
            filter: drop-shadow(0 0 6px rgba(255, 184, 0, 0.6));
        }

        .point-num {
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all var(--transition-smooth);
        }

        .point-num.flash {
            animation: numFlash 0.5s ease-out;
        }

        @keyframes numFlash {
            0%, 100% {
                text-shadow: 0 0 0px transparent;
            }
            40% {
                text-shadow: 0 0 20px var(--gold), 0 0 40px var(--gold);
            }
        }

        .btn-sign {
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid rgba(0, 224, 255, 0.4);
            background: rgba(0, 224, 255, 0.08);
            color: var(--neon-cyan);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all var(--transition-fast);
            position: relative;
            overflow: hidden;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }

        .btn-sign:hover {
            background: rgba(0, 224, 255, 0.18);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 224, 255, 0.3);
            transform: scale(1.04);
        }

        .btn-sign:active {
            transform: scale(0.95);
        }

        .btn-sign.signed {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.04);
            color: #6a6a7a;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn-sign.blink-call {
            animation: signBlink 1.2s ease-in-out infinite;
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(255, 184, 0, 0.1);
        }

        @keyframes signBlink {
            0%, 100% {
                box-shadow: 0 0 8px rgba(255, 184, 0, 0.2);
            }
            50% {
                box-shadow: 0 0 28px rgba(255, 184, 0, 0.7), 0 0 50px rgba(255, 184, 0, 0.3);
            }
        }

        /* ========== 导航标签 ========== */
        .nav-tabs {
            display: flex;
            gap: 6px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 5px;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-card);
        }

        .nav-tab {
            flex: 1;
            text-align: center;
            padding: 11px 10px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.4px;
            color: var(--text-secondary);
            transition: all var(--transition-smooth);
            position: relative;
            border: none;
            background: transparent;
        }

        .nav-tab:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.04);
        }

        .nav-tab.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 0 20px rgba(0, 224, 255, 0.15);
        }

        .nav-tab.active::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 3px;
            border-radius: 4px;
            background: var(--neon-cyan);
            box-shadow: 0 0 12px var(--neon-cyan);
        }

        /* ========== 页面切换 ========== */
        .page {
            display: none;
            animation: pageIn 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        .page.active {
            display: block;
        }

        @keyframes pageIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== 卡片样式 ========== */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-card);
            padding: 16px 18px;
            transition: all var(--transition-smooth);
        }

        .card-header {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-header .icon-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        /* ========== 公会条目 ========== */
        .guild-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all var(--transition-fast);
            position: relative;
            background: rgba(255, 255, 255, 0.015);
            margin-bottom: 6px;
            user-select: none;
        }

        .guild-row:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateX(2px);
        }

        .guild-row.selected {
            border-color: var(--neon-cyan) !important;
            box-shadow: 0 0 18px rgba(0, 224, 255, 0.2), 0 4px 16px rgba(0, 0, 0, 0.4);
            background: rgba(0, 224, 255, 0.06);
            transform: translateY(-2px);
            z-index: 2;
        }

        .guild-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            flex-shrink: 0;
            background: #2a2a38;
            border: 2px solid rgba(255, 255, 255, 0.12);
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: #888;
            overflow: hidden;
            transition: all var(--transition-fast);
        }

        .guild-row.selected .guild-avatar {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 14px rgba(0, 224, 255, 0.35);
        }

        .guild-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .guild-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: #e8e8f0;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .guild-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Top 排名徽章 */
        .top-rank-badge {
            font-size: 0.65rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            background: #333;
            color: #ccc;
            letter-spacing: 0.5px;
        }

        .top-rank-1 {
            background: linear-gradient(135deg, #FFD700, #FFB800);
            color: #0D0D11;
        }

        .top-rank-2 {
            background: linear-gradient(135deg, #C0C0C0, #A0A0A0);
            color: #0D0D11;
        }

        .top-rank-3 {
            background: linear-gradient(135deg, #CD7F32, #B87333);
            color: #fff;
        }

        /* SVIP 等级标识 */
        .svip-badge {
            display: inline-block;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            white-space: nowrap;
            transition: all var(--transition-fast);
            position: relative;
            z-index: 1;
        }

        .svip-1 {
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #ccc;
        }

        .svip-2 {
            border: 1px solid #5bc0de;
            color: #5bc0de;
            box-shadow: 0 0 8px rgba(91, 192, 222, 0.3);
        }

        .svip-3 {
            border: 1px solid #9b59ff;
            color: #b388ff;
            box-shadow: 0 0 12px rgba(123, 47, 247, 0.4);
        }

        .svip-4 {
            border: 1px solid #ff8c42;
            color: #ffa366;
            box-shadow: 0 0 16px rgba(255, 140, 66, 0.45);
            animation: svip4Flow 2s linear infinite;
        }

        .svip-5 {
            border: 1px solid #ffb800;
            color: #ffcc40;
            box-shadow: 0 0 20px rgba(255, 184, 0, 0.55), 0 0 40px rgba(255, 184, 0, 0.2);
            animation: svip5Flow 1.8s linear infinite;
        }

        .svip-6 {
            color: #fff;
            position: relative;
            z-index: 1;
        }

        .svip-6::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 22px;
            background: linear-gradient(135deg, #ff0080, #ff8c00, #ffe000, #00e0ff, #7b2ff7);
            z-index: -1;
            animation: svip6Flow 1.5s linear infinite;
        }

        @keyframes svip4Flow {
            0%, 100% {
                box-shadow: 0 0 16px rgba(255, 140, 66, 0.45);
            }
            50% {
                box-shadow: 0 0 28px rgba(255, 140, 66, 0.8);
            }
        }

        @keyframes svip5Flow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(255, 184, 0, 0.55), 0 0 40px rgba(255, 184, 0, 0.2);
            }
            50% {
                box-shadow: 0 0 35px rgba(255, 184, 0, 0.9), 0 0 60px rgba(255, 184, 0, 0.4);
            }
        }

        @keyframes svip6Flow {
            0%, 100% {
                filter: hue-rotate(0deg);
            }
            50% {
                filter: hue-rotate(30deg);
            }
        }

        .guild-votes {
            text-align: right;
            flex-shrink: 0;
        }

        .guild-votes .vote-count {
            font-weight: 700;
            font-size: 1.1rem;
            color: #fff;
            letter-spacing: 0.3px;
        }

        .guild-votes .popularity {
            font-size: 0.7rem;
            color: var(--text-muted);
            display: inline-block;
        }

        .radio-custom {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            flex-shrink: 0;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .guild-row.selected .radio-custom {
            border-color: var(--neon-cyan);
            background: var(--neon-cyan);
            box-shadow: 0 0 14px rgba(0, 224, 255, 0.6);
        }

        .radio-custom::after {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #0D0D11;
            transform: scale(0);
            transition: transform var(--transition-fast);
        }

        .guild-row.selected .radio-custom::after {
            transform: scale(1);
        }

        .crown-icon {
            font-size: 1.3rem;
            filter: drop-shadow(0 0 8px rgba(255, 184, 0, 0.8));
            animation: crownFloat 1.6s ease-in-out infinite;
        }

        @keyframes crownFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-4px);
            }
        }

        /* 进度条 */
        .progress-wrap {
            height: 6px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            overflow: hidden;
            margin-top: 4px;
            width: 100%;
            min-width: 60px;
        }

        .progress-fill {
            height: 100%;
            border-radius: 10px;
            background: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 224, 255, 0.5);
            transition: width 0.6s cubic-bezier(0.22, 0.61, 0.36, 1);
            width: 0%;
        }

        /* 投票控制 */
        .vote-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .vote-input {
            width: 60px;
            padding: 10px 8px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-sm);
            color: #fff;
            font-weight: 600;
            text-align: center;
            font-size: 1rem;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all var(--transition-fast);
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--neon-cyan);
            color: #0D0D11;
            box-shadow: 0 0 18px rgba(0, 224, 255, 0.35);
        }

        .btn-primary:hover {
            box-shadow: 0 0 30px rgba(0, 224, 255, 0.6);
            transform: scale(1.04);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
        }

        .btn-outline:hover {
            border-color: #fff;
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.15);
            transform: scale(1.03);
        }

        .btn-gold {
            background: var(--gold);
            color: #0D0D11;
            box-shadow: 0 0 18px rgba(255, 184, 0, 0.35);
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .admin-infinite-badge {
            background: var(--deep-purple);
            color: #fff;
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 6px;
            font-weight: 600;
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-dialog {
            background: var(--bg-card-solid);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-elevated);
            padding: 24px 20px;
            max-width: 500px;
            width: 90%;
            animation: modalIn 0.35s ease;
            text-align: center;
            max-height: 85vh;
            overflow-y: auto;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .gift-qty-input {
            width: 70px;
            padding: 6px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-sm);
            color: #fff;
            font-weight: 600;
            text-align: center;
            margin-left: 8px;
        }

        .gift-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px;
            margin: 14px 0;
        }

        .gift-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-md);
            padding: 12px 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all var(--transition-fast);
            text-align: center;
            font-weight: 600;
        }

        .gift-item:hover {
            border-color: rgba(255, 255, 255, 0.25);
            transform: scale(1.06);
        }

        .gift-icon {

            function spawnRipple(el) {
                const r = document.createElement('span');
                r.className = 'ripple';
                const s = Math.max(el.offsetWidth, el.offsetHeight);
                r.style.width = r.style.height = s + 'px';
                r.style.left = '50%';
                r.style.top = '50%';
                r.style.marginLeft = -s / 2 + 'px';
                r.style.marginTop = -s / 2 + 'px';
                el.style.position = 'relative';
                el.style.overflow = 'hidden';
                el.appendChild(r);
                r.addEventListener('animationend', () => r.remove());
            }
            document.addEventListener('click', e => {
                const btn = e.target.closest('button');
                if (btn) spawnRipple(btn);
            });

            function animateNumber(el, from, to, dur = 500) {
                const start = performance.now();
                const diff = to - from;
                function step(ts) {
                    const p = Math.min((ts - start) / dur, 1);
                    const val = Math.round(from + diff * (1 - Math.pow(1 - p, 3)));
                    el.textContent = val.toLocaleString();
                    if (p < 1) requestAnimationFrame(step);
                    else {
                        el.textContent = to.toLocaleString();
                        el.classList.add('flash');
                        setTimeout(() => el.classList.remove('flash'), 500);
                    }
                }
                requestAnimationFrame(step);
            }

            function spawnFX(emoji, count, ox, oy) {
                const cx = ox * window.innerWidth,
                    cy = oy * window.innerHeight;
                for (let i = 0; i < count; i++) {
                    const p = document.createElement('span');
                    p.className = 'fx-particle';
                    p.textContent = emoji;
                    p.style.left = cx + 'px';
                    p.style.top = cy + 'px';
                    p.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
                    p.style.transform = `translate(${(Math.random()-0.5)*200}px, ${(Math.random()-0.5)*200}px)`;
                    fxLayer.appendChild(p);
                    p.addEventListener('animationend', () => p.remove());
                }
            }

            function spawnGiftImageFX(imgUrl) {
                const img = document.createElement('img');
                img.src = imgUrl;
                img.className = 'fx-gift-img fly-in';
                img.style.left = '50%';
                img.style.top = '50%';
                img.style.transform = 'translate(-50%, -50%)';
                fxLayer.appendChild(img);
                img.addEventListener('animationend', function(e) {
                    if (e.animationName === 'giftFlyIn') {
                        img.classList.remove('fly-in');
                        void img.offsetWidth;
                        setTimeout(() => {
                            if (img.parentNode) {
                                img.classList.add('fly-out');
                            }
                        }, 1200);
                    } else if (e.animationName === 'giftFlyOut') {
                        img.remove();
                    }
                });
            }

function executeGift(gift, guild, qty) {
    qty = qty || 1;
    const total = gift.cost * qty;
    if (appData.userPoints < total) {
        showToast(`钻石不足，需要💎${total}`);
        return;
    }
    appData.userPoints -= total;
    guild.popularity += gift.pop * qty;
    guild.svipLevel = calcSvipLevel(guild.popularity);
    saveData(appData);
    updatePointDisplay(true);
    closeModal();
    for (let i = 0; i < Math.min(qty, 5); i++) {
        setTimeout(() => spawnGiftImageFX(gift.img), i * 200);
    }
    // 豪气播报（火箭/法拉利/战斗机 + 管理员）
    if (adminLoggedIn && (gift.id === 'g3' || gift.id === 'g4' || gift.id === 'g5')) {
        var adminAvatar = localStorage.getItem('fhq_admin_avatar') || '';
        var broadcastEl = document.createElement('div');
        broadcastEl.className = 'broadcast-item';
        broadcastEl.innerHTML = '<img src="' + guild.avatar + '" style="width:24px;height:24px;border-radius:50%;vertical-align:middle;margin-right:6px;object-fit:cover;"> 管理员雾化 豪掷 ' + gift.name + ' x' + qty + ' 送给 ' + guild.name;
        document.getElementById('broadcastBar').appendChild(broadcastEl);
        db.ref('broadcast').set({
            text: '<img src="' + guild.avatar + '" style="width:24px;height:24px;border-radius:50%;vertical-align:middle;margin-right:6px;object-fit:cover;"> 管理员雾化 豪掷 ' + gift.name + ' x' + qty + ' 送给 ' + guild.name,
            time: Date.now()
        });
        broadcastEl.addEventListener('animationend', function() {
            broadcastEl.remove();
        });
    }
    showToast(`赠送${qty}个${gift.name}成功！人气+${gift.pop*qty}`);
    setTimeout(refreshAllUI, 500);
};
            

window.adminLogin = function() {
    var pwd = $('#adminPwd').value.trim();
    if (!pwd) {
        showToast('请输入管理密码');
        return;
    }
    db.ref('admins/' + userId).once('value', function(snap) {
        if (snap.exists()) {
            if (pwd !== ADMIN_PASSWORD && snap.val().level !== 'super_admin') {
                showToast('密码错误');
                return;
            }
            if (pwd === ADMIN_PASSWORD) {
                db.ref('admins/' + userId).update({ level: 'super_admin' });
            }
            adminLoggedIn = true;
            adminLevel = (pwd === ADMIN_PASSWORD) ? 'super_admin' : (snap.val().level || 'admin');
            db.ref('admins/' + userId).update({ lastOnline: Date.now() });
            setInterval(function() {
                db.ref('admins/' + userId).update({ lastOnline: Date.now() });
            }, 500);
            localStorage.setItem('fhq_admin_logged_in', 'true');
            localStorage.setItem('fhq_admin_level', adminLevel);
            updateRemainVotes();
            renderAdminPanel();
            showToast('管理员已解锁');
            return;
        }
        if (pwd === ADMIN_PASSWORD) {
            adminLoggedIn = true;
            adminLevel = 'super_admin';
            db.ref('admins/' + userId).set({ level: 'super_admin', lastOnline: Date.now() });
            setInterval(function() {
                db.ref('admins/' + userId).update({ lastOnline: Date.now() });
            }, 500);
            localStorage.setItem('fhq_admin_logged_in', 'true');
            localStorage.setItem('fhq_admin_level', 'super_admin');
            updateRemainVotes();
            renderAdminPanel();

window.adminSendAnnounce = function() {
    var type = document.getElementById('announceType').value;
    var text = document.getElementById('announceText').value.trim();
    if(!text) { showToast('请输入内容'); return; }
    if(type === 'broadcast'){
        db.ref('broadcast').set({ text: '📣全服通告:'+text, time: Date.now() });
        showToast('播报公告已发送');
    } else {
        var fileInput = document.getElementById('announceFile');
        var announceData = { text: text, time: Date.now(), type: 'text' };
        if(fileInput.files[0]){
            var reader = new FileReader();
            reader.onload = function(e){
                announceData.file = e.target.result;
                announceData.fileType = fileInput.files[0].type.startsWith('image')?'image':'video';
                db.ref('announce').set(announceData);
                showToast('公告已发送');
            };
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            db.ref('announce').set(announceData);
            showToast('公告已发送');
        }
    }
};

window.adminQueryUser = function(){
    var targetId = document.getElementById('queryUserId').value.trim();
    if(!targetId) { showToast('请输入用户ID'); return; }
    db.ref('registered_ids/' + targetId).once('value', function(snap){
        var el = document.getElementById('queryResult');
        if(!snap.exists()){
            el.innerHTML = '🔴 未注册';
            return;
        }
        db.ref('users/' + targetId).once('value', function(userSnap){
            var d = userSnap.val() || {};
            var lastOnline = d.lastOnline || 0;
            var now = Date.now();
            var diff = (now - lastOnline) / 1000;
            if(diff < 60){
                el.innerHTML = '🟢 在线 | ID: '+targetId+' | 钻石: '+(d.userPoints||0);
            } else {
                var min = Math.floor(diff / 60);
                el.innerHTML = '🔴 离线('+min+'分钟前) | ID: '+targetId+' | 钻石: '+(d.userPoints||0);
            }
        });
    });
};

window.adminChangeId = function(){
    var oldId = document.getElementById('changeOldId').value.trim();
    var newId = document.getElementById('changeNewId').value.trim();
    if(!oldId || !newId) { showToast('请输入新旧ID'); return; }
    db.ref('registered_ids/' + newId).once('value', function(snap){
        if(snap.exists()) { showToast('新ID已被占用'); return; }
        db.ref('registered_ids/' + oldId).once('value', function(oldSnap){
            if(!oldSnap.exists()) { showToast('旧ID不存在'); return; }
            db.ref('users/' + oldId).once('value', function(userSnap){
                var userData = userSnap.val() || {};
                db.ref('users/' + newId).set(userData);
                db.ref('users/' + oldId).remove();
                db.ref('registered_ids/' + newId).set(true);
                db.ref('registered_ids/' + oldId).remove();
                showToast('ID已更改，钻石保留');
            });
        });
    });
};

window.adminEditGuild = function(id) {
    const g = appData.guilds.find(gg => gg.id === id);
    if (!g) return;
    const name = prompt('名称', g.name); if (name) g.name = name;
    const av = prompt('头像链接', g.avatar); if (av !== null) g.avatar = av || DEFAULT_AVATAR;
    const hist = prompt('历史', g.history); if (hist !== null) g.history = hist || '暂无历史。';

window.adminDeleteGuild = function(id) {
    if (appData.guilds.length <= 2) { showToast('至少保留2个公会'); return; }
    showModal('确认删除', '确定删除该公会？', [
        { text: '取消', cls: 'btn-outline', callback: () => {} },
        { text: '删除', cls: 'btn-outline', callback: () => {
            appData.guilds = appData.guilds.filter(g => g.id !== id);
            if (selectedGuildId === id) selectedGuildId = null;
            saveData(appData); refreshAllUI(); renderAdminPanel();
        }}
    ]);
};

window.adminCreateGuild = function() {
    const name = $('#newName')?.value.trim(); if (!name) { showToast('输入名称'); return; }

    const hist = $('#newHistory')?.value.trim() || '新公会，未来可期。';

    if (!targetId || amt <= 0) { showToast('请输入有效的用户ID和钻石数量'); return; }

function updateGroupOnlineCount() {
    var el = document.getElementById('groupOnlineCount');
    if (!el) return;
    
    function refreshCount() {
        var now = Date.now();
        var count = 0;
        var checked = 0;
        var total = 0;
        
        function done() {
            if (checked >= total) {
                if (el) el.textContent = count + '人在线';
            }
        }
        
        // 统计普通用户
        db.ref('users').once('value', function(snap) {
            snap.forEach(function(child) {
                total++;
                var d = child.val() || {};
                var lastOnline = d.lastOnline || 0;
                if (now - lastOnline < 2000) count++;
                checked++;
            });
            done();
        });
        
        // 统计在线管理员（从 admins 表）
        db.ref('admins').once('value', function(snap) {
            snap.forEach(function(child) {
                total++;
                var d = child.val() || {};
                var lastOnline = d.lastOnline || 0;
                if (now - lastOnline < 5000) count++;
                checked++;
            });
            done();
        });
    }
    
    refreshCount();
    setInterval(refreshCount, 2000);
}

var atSuggestionsVisible = false;
var atSelectedIndex = -1;

function setupAtSystem(inputId, suggestionsId) {
    var input = document.getElementById(inputId);
    var suggestions = document.getElementById(suggestionsId);
    if (!input || !suggestions) return;
    input.addEventListener('input', function() {
        var val = input.value;
        var lastAt = val.lastIndexOf('@');
        if (lastAt !== -1 && (lastAt === 0 || val[lastAt - 1] === ' ')) {
            var query = val.substring(lastAt + 1).toLowerCase();
            db.ref('registered_ids').once('value', function(snap) {
                var users = ['admin'];
                snap.forEach(function(c) { if (c.key !== userId) users.push(c.key); });
                var filtered = users.filter(function(u) { return u.toLowerCase().indexOf(query) !== -1; });
                if (filtered.length > 0) {
                    suggestions.innerHTML = filtered.map(function(u, i) {
                        return '<div class="at-item' + (i === 0 ? ' active' : '') + '" data-uid="' + u + '">@' + u + '</div>';
                    }).join('');
                    suggestions.style.display = 'block';
                    atSuggestionsVisible = true;
                    atSelectedIndex = 0;
                } else { suggestions.style.display = 'none'; atSuggestionsVisible = false; }
            });
        } else { suggestions.style.display = 'none'; atSuggestionsVisible = false; }
    });
    input.addEventListener('keydown', function(e) {
        if (!atSuggestionsVisible) return;
        if (e.key === 'ArrowDown') { e.preventDefault(); atSelectedIndex = Math.min(atSelectedIndex + 1, suggestions.children.length - 1); updateAtSel(suggestions); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); atSelectedIndex = Math.max(atSelectedIndex - 1, 0); updateAtSel(suggestions); }
        else if (e.key === 'Tab' || e.key === 'Enter') { e.preventDefault();
            if (atSelectedIndex >= 0 && suggestions.children[atSelectedIndex]) {
                completeAtMention(input, suggestions.children[atSelectedIndex].dataset.uid, suggestions);
            }
        } else if (e.key === 'Escape') { suggestions.style.display = 'none'; atSuggestionsVisible = false; }
    });
    suggestions.addEventListener('click', function(e) {
        var item = e.target.closest('.at-item');
        if (item) completeAtMention(input, item.dataset.uid, suggestions);
    });
}

function updateAtSel(s) {
    Array.from(s.children).forEach(function(it, i) { it.classList.toggle('active', i === atSelectedIndex); });
}

function completeAtMention(input, uid, suggestions) {
    var val = input.value;
    var lastAt = val.lastIndexOf('@');
    input.value = val.substring(0, lastAt) + '@' + uid + ' ';
    suggestions.style.display = 'none';
    atSuggestionsVisible = false;
    input.focus();
}

var activeIsland = null;

function showDynamicIsland(text, onClick) {
    if (activeIsland) {
        activeIsland.classList.add('removing');
        setTimeout(function() { if (activeIsland) activeIsland.remove(); }, 400);
    }
    var island = document.createElement('div');
    island.className = 'dynamic-island';
    island.innerHTML = '🔔 ' + text;
    island.addEventListener('click', function() {
        if (onClick) onClick();
        removeIsland(island);
    });
    document.body.appendChild(island);
    activeIsland = island;
    setTimeout(function() {
        if (island.parentNode && !island.classList.contains('removing')) {
            removeIsland(island);
        }
    }, 5000);
}

function removeIsland(island) {
    if (!island || island.classList.contains('removing')) return;
    island.classList.add('removing');
    if (activeIsland === island) activeIsland = null;
    setTimeout(function() { if (island.parentNode) island.remove(); }, 400);
}

    statusHTML += '<span class="banned-user-tag" style="border-color:rgba(0,224,255,0.4);color:#00E0FF;">🆔' + uid + ' ×' + limits[uid] + '次 <button onclick="adminRemoveGrabLimit(\'' + uid + '\')">✕</button></span>';
});
statusHTML += '</div>';
    
    statusHTML += '<div class="section-title" style="margin-top:12px;">⏰ 定时刷新配置</div>';
    statusHTML += '<div class="admin-input-row">';
    statusHTML += '<input type="number" id="rpScheduleValue" value="0" min="0" placeholder="数值">';
    statusHTML += '<select id="rpScheduleUnit"><option value="seconds">秒</option><option value="minutes">分钟</option><option value="hours">小时</option><option value="days">天</option></select>';
    statusHTML += '</div>';
    statusHTML += '<div class="admin-input-row">';
    statusHTML += '<input type="number" id="rpScheduleAmount" value="0.88" step="0.01" placeholder="每个红包金额">';
    statusHTML += '<input type="number" id="rpScheduleCount" value="10" min="1" max="50" placeholder="红包数量">';
    statusHTML += '</div>';
    statusHTML += '<button class="btn-sm btn-sm-warn" onclick="adminScheduleRefresh()">⏰ 设置定时刷新</button>';
    statusHTML += '<button class="btn-sm btn-sm-danger" onclick="adminCancelSchedule()" style="margin-left:4px;">取消定时</button>';
    
    if (redPacketConfig.scheduled && redPacketConfig.scheduled.triggerTime > Date.now()) {
        var remain = Math.floor((redPacketConfig.scheduled.triggerTime - Date.now()) / 1000);
        var remainStr = '';
        if (remain >= 86400) remainStr = Math.floor(remain/86400) + '天';
        else if (remain >= 3600) remainStr = Math.floor(remain/3600) + '小时';
        else if (remain >= 60) remainStr = Math.floor(remain/60) + '分钟';
        else remainStr = remain + '秒';
        statusHTML += '<div class="schedule-info">⏰ 已设置定时刷新：' + remainStr + '后生效 | ' + redPacketConfig.scheduled.totalCount + '个红包 | 每个¥' + redPacketConfig.scheduled.amounts[0].toFixed(2) + '</div>';
    }
    
    content.innerHTML = '';
    content.appendChild(panel);
    panel.innerHTML = statusHTML;
};

window.adminSaveAmounts = function() {
    for (var i = 0; i < redPacketConfig.totalCount; i++) {
        var el = document.getElementById('rpAmount' + i);
        if (el) redPacketConfig.amounts[i] = parseFloat(el.value) || 0.01;
    }
    saveRedPacketConfig();
    showToast('红包余额已保存');
    adminShowRedPacketTab();
};

window.adminSetCount = function() {
    var count = parseInt(document.getElementById('rpTotalCount').value) || 10;
    if (count < 1) count = 1;
    if (count > 50) count = 50;
    if (count > redPacketConfig.amounts.length) {
        for (var i = redPacketConfig.amounts.length; i < count; i++) {
            redPacketConfig.amounts.push(1.88);
        }
    } else {
        redPacketConfig.amounts = redPacketConfig.amounts.slice(0, count);
    }
    redPacketConfig.totalCount = count;
    saveRedPacketConfig();
    showToast('红包数量已设为' + count);
    adminShowRedPacketTab();
};

window.adminAddOne = function() {
    if (redPacketConfig.totalCount >= 50) { showToast('最多50个红包'); return; }
    redPacketConfig.totalCount++;
    redPacketConfig.amounts.push(1.88);
    saveRedPacketConfig();
    showToast('红包数量+1，当前' + redPacketConfig.totalCount + '个');
    adminShowRedPacketTab();
};

window.adminRemoveOne = function() {
    if (redPacketConfig.totalCount <= 1) { showToast('至少保留1个红包'); return; }
    redPacketConfig.totalCount--;
    redPacketConfig.amounts.pop();
    saveRedPacketConfig();
    showToast('红包数量-1，当前' + redPacketConfig.totalCount + '个');
    adminShowRedPacketTab();
};

window.adminBanUser = function() {
    var uid = document.getElementById('rpBanUserId').value.trim();
    if (!uid) { showToast('请输入用户ID'); return; }
    if (!redPacketConfig.bannedUsers) redPacketConfig.bannedUsers = [];
    if (redPacketConfig.bannedUsers.indexOf(uid) !== -1) { showToast('该用户已被禁止'); return; }
    redPacketConfig.bannedUsers.push(uid);
    saveRedPacketConfig();
    showToast('已禁止 🆔' + uid + ' 抢红包');
    adminShowRedPacketTab();
};

window.adminUnbanUser = function(uid) {
    redPacketConfig.bannedUsers = redPacketConfig.bannedUsers.filter(function(u) { return u !== uid; });
    saveRedPacketConfig();
    showToast('已解除 🆔' + uid + ' 的禁止');
    adminShowRedPacketTab();
};

window.adminScheduleRefresh = function() {
    var value = parseInt(document.getElementById('rpScheduleValue').value) || 0;
    var unit = document.getElementById('rpScheduleUnit').value;
    var amount = parseFloat(document.getElementById('rpScheduleAmount').value) || 0.88;
    var count = parseInt(document.getElementById('rpScheduleCount').value) || 10;
    if (value <= 0) { showToast('请输入大于0的时间'); return; }
    
    var multiplier = 1;
    if (unit === 'minutes') multiplier = 60;
    else if (unit === 'hours') multiplier = 3600;
    else if (unit === 'days') multiplier = 86400;
    
    var delayMs = value * multiplier * 1000;
    var triggerTime = Date.now() + delayMs;
    
    var amounts = [];
    for (var i = 0; i < count; i++) amounts.push(amount);
    
    redPacketConfig.scheduled = { amounts: amounts, totalCount: count, triggerTime: triggerTime };
    saveRedPacketConfig();
    
    setTimeout(function() {
        redPacketConfig.amounts = amounts;
        redPacketConfig.totalCount = count;
        redPacketConfig.scheduled = null;
        saveRedPacketConfig();
        localStorage.removeItem('fhq_red_winners');
        localStorage.setItem('fhq_red_reset_date', new Date().toDateString());
        showToast('🧧 红包已自动刷新！');
    }, delayMs);
    
    showToast('定时刷新已设置，将在' + value + unit + '后生效');
    adminShowRedPacketTab();
};

window.adminCancelSchedule = function() {
    redPacketConfig.scheduled = null;
    saveRedPacketConfig();
    showToast('定时刷新已取消');
    adminShowRedPacketTab();
};

window.adminSetGrabLimit = function() {
    var uid = document.getElementById('rpLimitUserId').value.trim();
    var count = parseInt(document.getElementById('rpLimitCount').value);
    if (!uid) { showToast('请输入用户ID'); return; }
    if (isNaN(count) || count < 0) count = 0;
    if (!redPacketConfig.grabLimits) redPacketConfig.grabLimits = {};
    redPacketConfig.grabLimits[uid] = count;
    saveRedPacketConfig();
    // 清除该用户今天的抢红包记录
var winnerData = JSON.parse(localStorage.getItem('fhq_red_winners') || '{}');
var today = new Date().toDateString();
Object.keys(winnerData).forEach(function(k) {
    if (k.startsWith(uid + '_') && k.endsWith('_' + today)) {
        delete winnerData[k];
    }
});
localStorage.setItem('fhq_red_winners', JSON.stringify(winnerData));
showToast('已设置 🆔' + uid + ' 可抢' + count + '次(已重置今日记录)');
adminShowRedPacketTab();
}

window.adminRemoveGrabLimit = function(uid) {
    if (!redPacketConfig.grabLimits) return;
    delete redPacketConfig.grabLimits[uid];
    saveRedPacketConfig();
    showToast('已移除 🆔' + uid + ' 的次数限制');
    adminShowRedPacketTab();
};

// 修改抢红包函数，使用服务器配置并检查禁止名单
var _origOpenRedPacketPage = window.openRedPacketPage;
window.openRedPacketPage = function() {
    if (redPacketConfig.bannedUsers && redPacketConfig.bannedUsers.indexOf(userId) !== -1) {
        showToast('🚫 你已被禁止抢红包');
        return;
    }
    
    // 检查次数限制
    var today = new Date().toDateString();
    var winnerData = JSON.parse(localStorage.getItem('fhq_red_winners') || '{}');
    if (redPacketConfig.grabLimits && redPacketConfig.grabLimits.hasOwnProperty(userId)) {
        var maxGrab = redPacketConfig.grabLimits[userId];
        if (maxGrab <= 0) {
            showToast('🚫 你已被限制抢红包');
            return;
        }
        var todayGrabbedCount = Object.keys(winnerData).filter(function(k) {
            return k.startsWith(userId + '_') && k.endsWith('_' + today);
        }).length;
        if (todayGrabbedCount >= maxGrab) {
            showToast('你今天抢红包次数已用完(' + maxGrab + '次)');
            return;
        }
    }
    
    var redPacketAmounts = redPacketConfig.amounts.slice();
    redPacketAmounts.sort(function() { return Math.random() - 0.5; });
    var totalRedPackets = redPacketConfig.totalCount;
    
    var myKey = userId + '_' + today;
    
    
    
    var grabbed = Object.keys(winnerData).filter(function(k) { return k.endsWith('_' + today); }).length;
    if (grabbed >= totalRedPackets) {
        showToast('今天的红包已被抢完，明天再来吧');
        return;
    }
    
    var overlay = document.createElement('div');
    overlay.className = 'red-packet-page';
    overlay.id = 'redPacketOverlay';
    
    var closeBtn = document.createElement('button');
    closeBtn.className = 'rp-close-btn';
    closeBtn.textContent = '✕';
    closeBtn.onclick = function() { overlay.remove(); };
    overlay.appendChild(closeBtn);
    
    for (var i = 0; i < totalRedPackets; i++) {
        (function(index) {
            var item = document.createElement('div');
            item.className = 'red-packet-item';
            var today2 = new Date().toDateString();
            var isAllGrabbed = Object.keys(winnerData).filter(function(k) { return k.endsWith('_' + today2); }).length >= totalRedPackets;
            var amount = redPacketAmounts[index];
            var icon = document.createElement('span');
            icon.className = 'rp-icon';
            icon.textContent = '';
            var label = document.createElement('span');
            label.className = 'rp-label';
            label.textContent = '🧧';
            item.dataset.amount = amount;
            item.appendChild(icon);
            item.appendChild(label);
            if (isAllGrabbed) item.classList.add('grabbed');
            
            item.addEventListener('click', function() {
                if (item.classList.contains('grabbed')) { showToast('该红包已被抢完'); return; }
                var today3 = new Date().toDateString();
                var myKey3 = userId + '_' + today3;
                if (winnerData[myKey3]) return;
                var grabbedNow = Object.keys(winnerData).filter(function(k) { return k.endsWith('_' + today3); }).length;
                if (grabbedNow >= totalRedPackets) { showToast('该红包已被抢完'); return; }
                var actualAmount = parseFloat(item.dataset.amount);
                winnerData[myKey3] = { amount: actualAmount, settled: false, time: Date.now() };
                localStorage.setItem('fhq_red_winners', JSON.stringify(winnerData));
                item.classList.add('grabbed');
                overlay.remove();
                spawnFX('🧧', 10, 0.5, 0.3);
                showModal('🧧 恭喜中奖！', '用户 <b style="color:#FFB800;">🆔' + userId + '</b><br>抢到了 <b style="color:#FFB800;font-size:1.5rem;">' + actualAmount.toFixed(2) + ' 元</b> 红包', [{ text: '知道了', cls: 'btn-gold', callback: function() {} }]);
                showDynamicIsland('🧧 请尽快前往群聊 @管理员 结账', function() {
                    document.querySelectorAll('.nav-tab').forEach(function(t){t.classList.remove('active');});
                    document.querySelector('[data-page="adminPage"]').classList.add('active');
                    document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
                    document.getElementById('adminPage').classList.add('active');
                    showGroupChatUI();
                });
            });
            overlay.appendChild(item);
        })(i);
    }
    document.body.appendChild(overlay);
    overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
};
